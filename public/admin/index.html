<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Spindex admin</title>
  <style>
    :root { color-scheme: dark; --bg: #0e0e12; --panel: #17171d; --line: #2a2a33; --text: #ececf1; --muted: #9a9aa6; --accent: #ff6a4d; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px 16px 64px; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, system-ui, sans-serif; }
    main { max-width: 760px; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    h2 { font-size: 1rem; margin: 28px 0 8px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
    p { margin: 6px 0; color: var(--muted); }
    form { display: flex; gap: 8px; margin: 16px 0; }
    input { flex: 1; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit; }
    button { padding: 10px 16px; border-radius: 10px; border: 0; background: var(--accent); color: #fff; font: inherit; font-weight: 600; }
    .reading { padding: 14px 16px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); color: var(--text); }
    dl { margin: 0; }
    dl div { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
    dt { color: var(--muted); }
    dd { margin: 0; text-align: right; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 500; }
    .error { color: #ff8a8a; }
    [hidden] { display: none; }
  </style>
</head>
<body>
<main>
  <h1>Spindex admin</h1>
  <p>Discogs slow-downs seen by the server over the past 30 days.</p>

  <form id="login">
    <input id="token" type="password" placeholder="Admin token" autocomplete="off" aria-label="Admin token">
    <button type="submit">Show</button>
  </form>
  <p id="message" class="error" hidden></p>

  <div id="report" hidden>
    <h2>What this suggests</h2>
    <p class="reading" id="reading"></p>

    <h2>Summary</h2>
    <dl id="summary"></dl>

    <h2>Where requests leave from</h2>
    <dl id="egress"></dl>

    <h2>Recent slow-downs</h2>
    <table>
      <thead><tr><th>When</th><th>Request</th><th>Budget used</th><th>Wait</th><th>Data centre</th></tr></thead>
      <tbody id="events"></tbody>
    </table>
    <p id="empty" hidden>No slow-downs recorded yet.</p>
  </div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const KEY = 'spindex_admin_token';
  const store = {
    get: () => { try { return sessionStorage.getItem(KEY) || ''; } catch { return ''; } },
    set: (v) => { try { sessionStorage.setItem(KEY, v); } catch { /* the token just is not remembered */ } },
  };

  function ago(at, now) {
    const minutes = Math.max(0, Math.floor((now - at) / 60000));
    if (minutes < 1) return 'just now';
    if (minutes < 60) return `${minutes} min ago`;
    const hours = Math.floor(minutes / 60);
    return hours < 48 ? `${hours} hr ago` : `${Math.floor(hours / 24)} days ago`;
  }

  function rows(target, pairs) {
    target.replaceChildren(...pairs.map(([k, v]) => {
      const row = document.createElement('div');
      const dt = document.createElement('dt');
      const dd = document.createElement('dd');
      dt.textContent = k;
      dd.textContent = v;
      row.append(dt, dd);
      return row;
    }));
  }

  const tally = (counts) => Object.entries(counts || {}).sort((a, b) => b[1] - a[1]).map(([k, v]) => `${k} ${v}`).join(', ') || 'none';

  function show(data) {
    $('reading').textContent = data.summary.total ? data.summary.reading : 'No slow-downs recorded yet, so there is nothing to read.';
    rows($('summary'), [
      ['Slow-downs recorded', data.summary.total],
      ['Typical budget used when refused', data.summary.medianUsed === null ? 'not reported' : `${data.summary.medianUsed} of 60`],
      ['By request', tally(data.summary.byKind)],
      ['By data centre', tally(data.summary.byColo)],
      ['Logging', data.logging ? 'on' : 'off (no DISCOGS_DATA store is bound)'],
    ]);
    rows($('egress'), data.egress
      ? [['Address Cloudflare sees', data.egress.ip || 'unknown'], ['Data centre', data.egress.colo || 'unknown'], ['Country', data.egress.loc || 'unknown']]
      : [['Address Cloudflare sees', 'could not be read']]);
    $('events').replaceChildren(...data.events.map((e) => {
      const tr = document.createElement('tr');
      for (const text of [ago(e.at, data.now), e.kind, e.used === null ? 'not reported' : `${e.used} of ${e.limit ?? 60}`, e.retryAfter ? `${e.retryAfter}s` : 'none', e.colo]) {
        const td = document.createElement('td');
        td.textContent = text;
        tr.append(td);
      }
      return tr;
    }));
    $('empty').hidden = data.events.length > 0;
    $('report').hidden = false;
  }

  async function load(token) {
    $('message').hidden = true;
    try {
      const res = await fetch('/api/admin/throttles', { headers: { Authorization: `Bearer ${token}` }, cache: 'no-store' });
      if (res.status === 401 || res.status === 404) throw new Error(res.status === 404 ? 'The admin page is not set up on this server.' : 'That token was not accepted.');
      if (!res.ok) throw new Error('The server could not answer.');
      store.set(token);
      show(await res.json());
    } catch (err) {
      $('report').hidden = true;
      $('message').textContent = err.message;
      $('message').hidden = false;
    }
  }

  $('login').addEventListener('submit', (event) => {
    event.preventDefault();
    const token = $('token').value.trim();
    if (token) load(token);
  });
  if (store.get()) load(store.get());
</script>
</body>
</html>
